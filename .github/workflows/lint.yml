name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Run shellcheck
        run: shellcheck *.sh
